name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -s sh install.sh scripts/check_install.sh scripts/check_piped_install.sh
      - name: Python syntax
        run:           python3 -m py_compile scripts/check_skills.py scripts/apply_addons.py scripts/apply_hooks.py scripts/check_consent.py scripts/check_hooks.py scripts/check_stacks.py skills/hstack/hstack/scripts/hstack_stack.py hooks/hstack_hook.py hooks/guard.py hooks/save.py hooks/suggest.py bin/hstack-bench bin/hstack-test bin/hstack-pr bin/hstack-visdiff bin/hstack-scan bin/hstack-decisions
      - name: Skills
        run: python3 scripts/check_skills.py
      - name: Consent
        run: python3 scripts/check_consent.py
      - name: Hooks
        run: python3 scripts/check_hooks.py
      - name: Stacks
        run: python3 scripts/check_stacks.py
      - name: Installer
        run: sh scripts/check_install.sh
      - name: BSD tar
        run: sudo apt-get install -y libarchive-tools
      - name: Site
        run: |
          cd site
          npm ci
          npm run build
          node scripts/check-no-html.mjs
          node scripts/check-pages.mjs
          node scripts/check-vercel.mjs
          cd ..
          sh scripts/check_piped_install.sh
